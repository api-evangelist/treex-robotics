aid: treex-robotics
name: TreeX Robotics
description: TreeX Robotics is an Israeli physical-AI company founded in 2024 that
  is bringing autonomous robotics to outdoor field operations at scale. TreeX replaces
  human field crews with fleets of physical AI-powered autonomous workers that perform
  high-skill field operations as an on-demand labor service, regardless of terrain
  or ground conditions. The company is backed by Lightspeed Venture Partners (seed,
  2024) and operates in Israel, the United States, and Italy. TreeX publishes no
  public developer portal, API documentation, or SDKs at this time.
